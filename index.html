<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherpas Wealth — Historias Financieras Interactivas</title>
  
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/questionnaire.css">
  <link rel="stylesheet" href="/static/video.css?v=2">
</head>
<body>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div class="brand-copy">
          <div class="brand-title">Sherpas Wealth</div>
          <div class="brand-subtitle">Historias financieras interactivas</div>
        </div>
      </div>
      <div class="family-picker">
        <label for="family-select"><strong>Familia:</strong> </label>
        <select id="family-select" onchange="initFlow()">
          <option value="timothy-melanie-weah">Timothy & Melanie Weah</option>
          <option value="michael-carter">Michael Carter</option>
          <option value="daniel-emily-johnson">Daniel & Emily Johnson</option>
          <option value="samantha-lewis">Samantha Lewis</option>
        </select>
      </div>
    </header>

    <div class="status-bar" role="status">
      <span class="status-copy"><span class="status-indicator" aria-hidden="true"></span> Experiencia personalizada · Contrato JSON v1</span>
      <span class="status-badge" id="data-status-badge">Origen Datos</span>
    </div>

    <main class="app-content">
      <!-- ID exacto exigido por el componente de Julián -->
      <div id="questionnaire-container"></div>

      <!-- Contenedor del Reproductor Interactivo -->
      <div id="video-root"></div>
    </main>
  </div>

  <!-- Scripts de los módulos -->
  <script src="/static/questionnaire.js"></script>
  <script src="/static/video.js"></script>

  <script>
    function initFlow() {
      const selectedCaseId = document.getElementById("family-select").value;
      const qContainer = document.getElementById("questionnaire-container");
      const vRoot = document.getElementById("video-root");

      qContainer.style.display = "block";
      qContainer.innerHTML = "";
      vRoot.innerHTML = "";

      if (typeof window.SherpasQuestionnaire === "undefined") {
        qContainer.innerHTML = `<div class="error-card">⚠️ No se encuentra static/questionnaire.js</div>`;
        return;
      }

      // Integración exacta según el snippet de Julián
      window.SherpasQuestionnaire.mount({
        container: qContainer,
        caseId: selectedCaseId,
        onSubmit: async function (questionnaireRequestJson) {
          // Ocultar cuestionario y mostrar pantalla de carga
          qContainer.style.display = "none";
          vRoot.innerHTML = `
            <div class="loading-state">
              <div class="spinner"></div>
              <h3>Generando vuestra historia financiera personalizada...</h3>
              <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.5rem;">
                Analizando el plan de Sherpas e integrando vuestras prioridades.
              </p>
            </div>`;

          try {
            // Envío al Backend FastAPI (Frente B)
            const response = await fetch("/api/story", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(questionnaireRequestJson)
            });

            if (!response.ok) {
              const errData = await response.json();
              throw new Error(errData.detail || `Error HTTP ${response.status}`);
            }

            const storyData = await response.json();

            // Actualizar el estado de la fuente (mcp / local_case)
            const badge = document.getElementById("data-status-badge");
            if (badge) badge.textContent = storyData.data_status || "OK";

            vRoot.innerHTML = "";

            if (typeof window.SherpasVideo === "undefined") {
              throw new Error("No se encuentra static/video.js");
            }

            // Renderizar el vídeo (Frente C)
            window.SherpasVideo.mount({
              container: vRoot,
              story: storyData,
              onAsk: async function (videoQuestionRequestJson) {
                const askRes = await fetch("/api/video-ask", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(videoQuestionRequestJson)
                });
                const result = await askRes.json();
                if (!askRes.ok) {
                  throw new Error(result.detail || `Error HTTP ${askRes.status}`);
                }
                return result;
              }
            });

          } catch (error) {
            qContainer.style.display = "block";
            vRoot.innerHTML = "";
            throw error;
          }
        }
      });
    }

    document.addEventListener("DOMContentLoaded", initFlow);
  </script>
</body>
</html>
