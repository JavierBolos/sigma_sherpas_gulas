<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherpas Wealth — Historias Financieras Interactivas</title>
  
  <!-- CSS del Cuestionario de Persona A -->
  <link rel="stylesheet" href="/static/questionnaire.css">

  <style>
    :root {
      --primary: #2563eb;
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      line-height: 1.5;
      padding: 1.5rem;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 1.25rem 1.5rem;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-area { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon {
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title { font-size: 1.25rem; font-weight: 700; }
    .brand-subtitle { font-size: 0.8rem; color: #64748b; }

    select {
      padding: 0.6rem 0.9rem;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-weight: 600;
      cursor: pointer;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
    }

    .status-badge {
      background: #dbeafe;
      color: #1e3a8a;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .loading-state {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem auto;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error-card {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 1.5rem;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-area">
        <div class="logo-icon">S</div>
        <div>
          <div class="brand-title">Sherpas Wealth</div>
          <div class="brand-subtitle">Experiencia Financiera Interactiva</div>
        </div>
      </div>
      <div>
        <label for="family-select"><strong>Familia:</strong> </label>
        <select id="family-select" onchange="initFlow()">
          <option value="timothy-melanie-weah">Timothy & Melanie Weah</option>
          <option value="michael-carter">Michael Carter</option>
          <option value="daniel-emily-johnson">Daniel & Emily Johnson</option>
          <option value="samantha-lewis">Samantha Lewis</option>
        </select>
      </div>
    </header>

    <div class="status-bar">
      <span>Conectado a la API de Sherpas Wealth (Contrato v1)</span>
      <span class="status-badge" id="data-status-badge">Origen Datos</span>
    </div>

    <!-- ID exacto exigido por el componente de Julián -->
    <div id="questionnaire-container"></div>

    <!-- Contenedor del Reproductor Interactivo -->
    <div id="video-root"></div>
  </div>

  <!-- Scripts de los módulos -->
  <script src="/static/questionnaire.js"></script>
  <script src="/static/video.js"></script>

  <script>
    function initFlow() {
      const selectedCaseId = document.getElementById("family-select").value;
      const qContainer = document.getElementById("questionnaire-container");
      const vRoot = document.getElementById("video-root");

      qContainer.style.display = "block";
      qContainer.innerHTML = "";
      vRoot.innerHTML = "";

      if (typeof window.SherpasQuestionnaire === "undefined") {
        qContainer.innerHTML = `<div class="error-card">⚠️ No se encuentra static/questionnaire.js</div>`;
        return;
      }

      // Integración exacta según el snippet de Julián
      window.SherpasQuestionnaire.mount({
        container: qContainer,
        caseId: selectedCaseId,
        onSubmit: async function (questionnaireRequestJson) {
          // Ocultar cuestionario y mostrar pantalla de carga
          qContainer.style.display = "none";
          vRoot.innerHTML = `
            <div class="loading-state">
              <div class="spinner"></div>
              <h3>Generando vuestra historia financiera personalizada...</h3>
              <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.5rem;">
                Analizando el plan de Sherpas e integrando vuestras prioridades.
              </p>
            </div>`;

          try {
            // Envío al Backend FastAPI (Frente B)
            const response = await fetch("/api/story", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(questionnaireRequestJson)
            });

            if (!response.ok) {
              const errData = await response.json();
              throw new Error(errData.detail || `Error HTTP ${response.status}`);
            }

            const storyData = await response.json();

            // Actualizar el estado de la fuente (mcp / local_case)
            const badge = document.getElementById("data-status-badge");
            if (badge) badge.textContent = storyData.data_status || "OK";

            vRoot.innerHTML = "";

            if (typeof window.SherpasVideo === "undefined") {
              vRoot.innerHTML = `<div class="error-card">⚠️ No se encuentra static/video.js</div>`;
              return;
            }

            // Renderizar el vídeo (Frente C)
            window.SherpasVideo.mount({
              container: vRoot,
              story: storyData,
              onAsk: async function (videoQuestionRequestJson) {
                const askRes = await fetch("/api/video-ask", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(videoQuestionRequestJson)
                });
                return await askRes.json();
              }
            });

          } catch (err) {
            vRoot.innerHTML = `
              <div class="error-card">
                <h3>⚠️ Error al generar la historia</h3>
                <p>${err.message}</p>
              </div>`;
          }
        }
      });
    }

    document.addEventListener("DOMContentLoaded", initFlow);
  </script>
</body>
</html>
