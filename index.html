<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherpas Wealth — Historias Financieras Interactivas</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      line-height: 1.5;
      padding: 1.5rem;
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 1.25rem 1.5rem;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-area { display: flex; align-items: center; gap: 0.75rem; }

    .logo-icon {
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
    .brand-subtitle { font-size: 0.8rem; color: var(--text-muted); }

    .selector-group { display: flex; align-items: center; gap: 0.5rem; }

    label { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }

    select {
      padding: 0.6rem 0.9rem;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
    }

    .btn-reset {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-reset:hover { background: #e2e8f0; color: #1e293b; }

    /* Indicador de Estado */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
    }

    .status-badge {
      background: #dbeafe;
      color: #1e3a8a;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    /* Estados de carga y error */
    .loading-state {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 3rem 1.5rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem auto;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error-card {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 1.5rem;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-area">
        <div class="logo-icon">S</div>
        <div>
          <div class="brand-title">Sherpas Wealth</div>
          <div class="brand-subtitle">Experiencia Financiera Interactiva</div>
        </div>
      </div>
      <div class="selector-group">
        <label for="family-select">Familia:</label>
        <select id="family-select" onchange="initFlow()">
          <option value="timothy-melanie-weah">Timothy & Melanie Weah</option>
          <option value="michael-carter">Michael Carter</option>
          <option value="daniel-emily-johnson">Daniel & Emily Johnson</option>
          <option value="samantha-lewis">Samantha Lewis</option>
        </select>
        <button class="btn-reset" onclick="initFlow()">🔄 Reiniciar</button>
      </div>
    </header>

    <!-- Indicador de Estado -->
    <div class="status-bar">
      <span>Conectado a la API de Sherpas Wealth (Contrato v1)</span>
      <span class="status-badge" id="data-status-badge">Estado Datos</span>
    </div>

    <!-- Contenedor Cuestionario (Frente A) -->
    <div id="questionnaire-root"></div>

    <!-- Contenedor Reproductor (Frente C) -->
    <div id="video-root"></div>
  </div>

  <footer>
    Sherpas × UPV Hackathon 2026 — Equipo <code>sigma_sherpas_gulas</code>
  </footer>

  <!-- Módulos JavaScript independientes -->
  <script src="/static/questionnaire.js"></script>
  <script src="/static/video.js"></script>

  <script>
    function initFlow() {
      const caseId = document.getElementById("family-select").value;
      const qRoot = document.getElementById("questionnaire-root");
      const vRoot = document.getElementById("video-root");

      qRoot.style.display = "block";
      qRoot.innerHTML = "";
      vRoot.innerHTML = "";

      if (typeof window.SherpasQuestionnaire === "undefined") {
        qRoot.innerHTML = `
          <div class="error-card">
            <strong>⚠️ Módulo static/questionnaire.js no encontrado.</strong><br>
            Asegúrate de haber creado el archivo <code>static/questionnaire.js</code>.
          </div>`;
        return;
      }

      // 1. Montar Cuestionario (Frente A)
      window.SherpasQuestionnaire.mount({
        container: qRoot,
        caseId: caseId,
        onSubmit: async function (questionnaireRequestJson) {
          qRoot.style.display = "none";
          vRoot.innerHTML = `
            <div class="loading-state">
              <div class="spinner"></div>
              <h3>Generando vuestra historia financiera personalizada...</h3>
              <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.5rem;">
                Analizando el plan de Sherpas e integrando vuestras prioridades emocionales.
              </p>
            </div>`;

          try {
            // 2. Enviar datos al Backend (Frente B)
            const response = await fetch("/api/story", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(questionnaireRequestJson)
            });

            if (!response.ok) {
              const errData = await response.json();
              throw new Error(errData.detail || `Error HTTP ${response.status}`);
            }

            const storyResponseJson = await response.json();

            // Actualizar badge con el origen de los datos (mcp / local_case)
            const badge = document.getElementById("data-status-badge");
            if (badge) badge.textContent = storyResponseJson.data_status || "OK";

            vRoot.innerHTML = "";

            if (typeof window.SherpasVideo === "undefined") {
              vRoot.innerHTML = `
                <div class="error-card">
                  <strong>⚠️ Módulo static/video.js no encontrado.</strong><br>
                  Falta el archivo <code>static/video.js</code> para renderizar la secuencia de escenas.
                </div>`;
              return;
            }

            // 3. Montar Reproductor de Vídeo (Frente C)
            window.SherpasVideo.mount({
              container: vRoot,
              story: storyResponseJson,
              onAsk: async function (videoQuestionRequestJson) {
                const askRes = await fetch("/api/video-ask", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(videoQuestionRequestJson)
                });
                return await askRes.json();
              }
            });

          } catch (err) {
            vRoot.innerHTML = `
              <div class="error-card">
                <h3>⚠️ Error al conectar con el servidor</h3>
                <p>${err.message}</p>
                <button class="btn-reset" onclick="initFlow()" style="margin-top: 1rem;">Intentar de nuevo</button>
              </div>`;
          }
        }
      });
    }

    document.addEventListener("DOMContentLoaded", initFlow);
  </script>
</body>
</html>
